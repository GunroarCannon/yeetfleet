# Yeetfleet leaderboard Worker. Deploy steps: README.md.
name = "yeetfleet"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
CLUSTER = "devnet"
SIWS_DOMAIN = "gunroarcannon.github.io"
SIWS_STATEMENT = "Sign in to Yeetfleet as this pilot"
GENESIS_GROUP = "GT22s89nU4iWFkNXj1Bw6uYhJJWDRPpShHt4Bk8f99Te"
# Devnet only: these wallets count as Seekers so ranked play can be tested
# without a Seeker (the emulator's Phantom test pilot). Ignored on mainnet.
DEV_GENESIS_OWNERS = "GE7bEoKnVEkPQ7U7sQswPqq2AbZfNWEgMxcQiYjyHLdK"

# Secrets (never in this file): npx wrangler@4 secret put <NAME>
#   SESSION_SECRET   random, e.g. `openssl rand -hex 32`
#   MAINNET_RPC_URL  a Helius mainnet URL (the Genesis Token check)

[[d1_databases]]
binding = "DB"
database_name = "yeetfleet"
# From `npx wrangler@4 d1 create yeetfleet`:
database_id = "REPLACE_WITH_D1_DATABASE_ID"
